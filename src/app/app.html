
<div class="container">
  <h1>My Daily Task Tracker</h1>
  <p>Manage your daily tasks easily!</p>

  <!-- Form to add tasks -->
  <form (ngSubmit)="addTask()">
    <input
      type="text"
      name="taskTitle"
      [(ngModel)]="newTaskTitle"
      placeholder="Enter a new task"
      required
    />

    <!-- Select task priority -->
    <select name="priority" [(ngModel)]="newTaskPriority">
      <option value="normal">Normal Priority</option>
      <option value="high">High Priority</option>
    </select>

    <button type="submit">Add Task</button>
  </form>

  <h2>My Tasks</h2>

  <!-- Display tasks using the async pipe -->
  @for (task of (tasks$ | async); track task.id) {
    <div class="task" [appHighlight]="task.priority === 'high'">
      <input
        type="checkbox"
        [checked]="task.completed"
        (change)="toggleTask(task.id)"
      />

      <span [style.text-decoration]="task.completed ? 'line-through' : 'none'">
        {{ task.title | shorten:30 }}
      </span>

      <button type="button" (click)="deleteTask(task.id)">
        Delete
      </button>
    </div>
  } @empty {
    <p>No tasks yet. Add your first task!</p>
  }
</div>
